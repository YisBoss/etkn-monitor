<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETKN 监控</title>
<style>
:root{--bg:#0f1419;--card:#1a222c;--line:#2a3644;--tx:#e6edf3;--sub:#8b98a5;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;max-width:560px;margin:0 auto}
h1{font-size:18px;margin:4px 0 2px}
.updated{color:var(--sub);font-size:12px;margin-bottom:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;font-size:15px}
.tabs button.on{color:var(--tx);border-color:var(--acc);background:#16222f}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card.w{grid-column:1/-1}
.k{color:var(--sub);font-size:12px}
.v{font-size:22px;font-weight:700;margin:2px 0}
.v small{font-size:12px;color:var(--sub);font-weight:400;margin-left:4px}
.sub{font-size:12px;color:var(--sub)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.acc{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:400}
td.num,th.num{text-align:right}
.tag{display:inline-block;padding:1px 7px;border-radius:8px;font-size:11px;background:#22303f;color:var(--sub);margin-right:4px}
.eta{font-size:20px;font-weight:700;color:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:baseline}
.flist{max-height:260px;overflow-y:auto}
.hint{color:var(--sub);font-size:12px;margin:8px 0;text-align:center}
</style>
</head>
<body>
<h1>ETKN 监控 <span class="tag" id="roTag">只读 v1</span></h1>
<div class="updated" id="updated">连接中…</div>
<div class="tabs">
<button id="tab1" class="on" onclick="sw(1)">入库进度</button>
<button id="tab2" onclick="sw(2)">任务统计</button>
</div>

<div id="page1">
  <div class="grid">
    <div class="card"><div class="k">待处理（媒体）</div><div class="v warn" id="cQueued">-<small>媒体</small></div><div class="sub" id="cQueuedSub">- 任务排队/运行</div></div>
    <div class="card"><div class="k">今日完成（媒体）</div><div class="v ok" id="cDone">-<small>媒体</small></div><div class="sub" id="cDoneSub">- 任务</div></div>
    <div class="card"><div class="k">异常（媒体）</div><div class="v bad" id="cBad">-<small>未识别</small></div><div class="sub" id="cBadSub">- 任务失败/部分</div></div>
    <div class="card"><div class="k">预计完成（ETA）</div><div class="eta" id="cEta">-</div><div class="sub" id="cEtaSub">滚动窗口计算</div></div>
    <div class="card w"><div class="k">分类队列（媒体·任务）</div><div id="kQ" style="margin-top:6px">-</div></div>
  </div>
</div>

<div id="page2" style="display:none">
  <div class="grid">
    <div class="card w"><div class="k">今日分类统计（任务/媒体：成功+异常）</div>
      <table id="tKind"><thead><tr><th>类型</th><th class="num">任务</th><th class="num">媒体</th><th class="num">成功</th><th class="num">异常</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card w"><div class="k">今日失败/部分失败任务</div>
      <div class="flist"><table id="tFail"><thead><tr><th>#</th><th>类型</th><th>标题</th><th class="num">异常媒体</th><th class="num">时间</th></tr></thead><tbody></tbody></table></div>
    </div>
    <div class="card w"><div class="k">系统状态</div><div id="kDiag" style="margin-top:6px">-</div></div>
  </div>
</div>
<div class="hint">数据来源 ETKN 只读接口 · 自动刷新</div>
<script>
let POLL=15, metaLoaded=false;
function sw(n){
  document.getElementById('page1').style.display=n===1?'':'none';
  document.getElementById('page2').style.display=n===2?'':'none';
  document.getElementById('tab1').className=n===1?'on':'';
  document.getElementById('tab2').className=n===2?'on':'';
}
const f1=(s)=>s.split(' · ')[0];
function fmtCard(v,unit){return `${v}<small>${unit}</small>`}
async function refresh(){
  try{
    if(!metaLoaded){
      const m=await (await fetch('/api/meta')).json();
      POLL=Math.max(m.poll_interval||15,5); metaLoaded=true;
    }
    const r=await fetch('/api/status');
    if(r.status===503){const e=await r.json();document.getElementById('updated').textContent='首轮采集中…';return}
    const s=await r.json();
    const hm=(s.ts||'').slice(11,16);
    document.getElementById('updated').textContent=`更新于 ${hm} · ${s.healthy?'服务正常':'服务异常'}`;
    // 卡1 待处理：媒体主口径
    const a=s.active||{};
    document.getElementById('cQueued').innerHTML=fmtCard(a.media||0,'媒体');
    document.getElementById('cQueuedSub').textContent=`${a.tasks||0} 任务（排队+运行）`;
    // 卡2 今日完成：records.success 主口径
    const rec=s.records||{}, dn=s.done||{};
    document.getElementById('cDone').innerHTML=fmtCard(rec.success||0,'媒体');
    document.getElementById('cDoneSub').textContent=`${dn.tasks||0} 任务`;
    // 卡3 异常：unrecognized 主口径
    document.getElementById('cBad').innerHTML=fmtCard(rec.unrecognized||0,'未识别');
    const badTasks=(dn.by_kind)?Object.values(dn.by_kind).reduce((x,y)=>x+(y.bad_media>0?y.tasks:0),0):0;
    document.getElementById('cBadSub').textContent=`失败/部分任务 ${s.failed_today?.length||0} 个`;
    // 卡4 ETA
    const e=s.eta||{};
    document.getElementById('cEta').textContent=e.eta_text||'计算中';
    document.getElementById('cEtaSub').textContent=`速率 ${e.rate||0} 媒体/分 · 剩 ${e.remaining_media||0} 媒体（窗口 ${e.window_min||10} 分）`;
    // 分类队列
    const kb=a.by_kind||{};
    document.getElementById('kQ').innerHTML=Object.keys(kb).length?
      Object.entries(kb).map(([k,v])=>`<div class="row" style="padding:3px 0"><span>${k}</span><span class="sub">${v.media} 媒体 · ${v.tasks} 任务（排${v.queued}/行${v.running}）</span></div>`).join('')
      :'<div class="sub">当前队列为空</div>';
    // 任务统计表
    const tb=document.querySelector('#tKind tbody');tb.innerHTML='';
    Object.entries(dn.by_kind||{}).sort((x,y)=>y[1].tasks-x[1].tasks).forEach(([k,v])=>{
      tb.insertAdjacentHTML('beforeend',`<tr><td>${k}</td><td class="num">${v.tasks}</td><td class="num">${v.media}</td><td class="num ok">${v.ok_media}</td><td class="num ${v.bad_media?'bad':''}">${v.bad_media}</td></tr>`)});
    // 失败明细
    const tf=document.querySelector('#tFail tbody');tf.innerHTML='';
    (s.failed_today||[]).slice(0,30).forEach(x=>{
      tf.insertAdjacentHTML('beforeend',`<tr><td>${x.id}</td><td>${f1(x.title)||x.kind}</td><td>${(x.title||'').slice(0,18)}</td><td class="num bad">${x.bad_media||x.media||0}</td><td class="num">${(x.finished_at||'').slice(11,16)}</td></tr>`)});
    // 系统状态
    const d=s.diag||{};
    document.getElementById('kDiag').innerHTML=Object.keys(d).length?
      `<div class="row"><span>全局运行</span><span class="sub">队列${d.queued_runs||0} · 运行${d.running_runs||0}</span></div>
       <div class="row"><span>历史累计</span><span class="sub">成功${d.succeeded_runs||0} · 失败<span class="bad">${d.failed_runs||0}</span> · 部分${d.partial_runs||0}</span></div>`
      :'-';
  }catch(err){
    document.getElementById('updated').textContent='连接失败：'+String(err).slice(0,60);
  }
}
refresh();setInterval(refresh,POLL*1000);
</script>
</body>
</html>
