services:
  etkn-monitor:
    image: python:3.12-alpine
    container_name: etkn-monitor
    restart: unless-stopped
    working_dir: /app
    command: python -u monitor.py
    env_file:
      - .env
    environment:
      - MONITOR_PORT=8620
      # 可选：ETKN_ETA_WINDOW=10 / POLL_INTERVAL=15（不填走 monitor.py 默认）
    ports:
      - "8620:8620"
    volumes:
      - ./:/app:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8620/api/meta >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
