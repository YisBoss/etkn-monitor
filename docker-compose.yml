services:
  etkn-monitor:
    image: python:3.12-alpine
    container_name: etkn-monitor
    restart: unless-stopped
    working_dir: /app
    command: python -u monitor.py
    env_file:
      - .env
    environment:
      - MONITOR_PORT=8620
      # 设置持久化目录（宿主机仓库内 data/，容器重建不丢配置；v2.5.5 修复：原先落
      # 容器可写层 /data，13:11 容器重建后 webhook_url/push_enabled 全部归零）
      - SETTINGS_PATH=/app/data/settings.json
      # 可选：ETKN_ETA_WINDOW=10 / POLL_INTERVAL=15（不填走 monitor.py 默认）
    ports:
      - "8620:8620"
    volumes:
      - ./:/app:ro
      - ./data:/app/data
      # v2.7 自动喂料：CloudDrive 115 云盘挂载（fuse；同挂载内 os.rename=115 秒级移动）
      - /vol1/1000/CloudNAS/CloudDrive/115:/cloud115:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8620/api/meta >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
