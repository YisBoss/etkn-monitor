services:
  etkn-monitor:
    build: .                  # 本地构建（Dockerfile 里装 sshpass + openssh-client，供 hosts 巡检 SSH 用）
    image: etkn-monitor:latest
    container_name: etkn-monitor
    restart: unless-stopped
    working_dir: /app
    command: python -u monitor.py
    # 首次克隆时还没有 .env 也能正常启动（required: false 需要 Docker Compose ≥ 2.24）
    env_file:
      - path: .env
        required: false
    environment:
      # 端口取自 .env 的 MONITOR_PORT，默认 8620（改 .env 即可换端口）
      - MONITOR_PORT=${MONITOR_PORT:-8620}
      # 设置持久化目录（宿主机仓库内 data/，容器重建不丢配置）
      - SETTINGS_PATH=/app/data/settings.json
      # 其它可选变量写在 .env 里，见 .env.example
    ports:
      - "${MONITOR_PORT:-8620}:${MONITOR_PORT:-8620}"
    volumes:
      - ./:/app:ro
      - ./data:/app/data
      # 注：自动喂料走 CloudDrive2 的 WebDAV 接口（面板【喂料】里配），不依赖本地挂载，
      #     所以这里不再挂 cloud115。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MONITOR_PORT:-8620}/api/meta >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
